support: https://github.com/Matze1985/umbrelos/issues
port: 18080
gallery: []
releaseNotes: >-
  Erste Community-App-Version. Steam Headless mit AMD-Render-Node,
  Steam Remote Play und persistenten Docker-Volumes.
permissions:
  - GPU
