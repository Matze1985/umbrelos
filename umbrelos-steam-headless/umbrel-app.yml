manifestVersion: 1
id: umbrelos-steam-headless
category: gaming
name: Steam Headless
icon: https://raw.githubusercontent.com/Steam-Headless/docker-steam-headless/refs/heads/master/images/steam-icon.png
version: "1.0.1"
tagline: Steam-Spiele mit AMD-Grafik auf Android TV streamen
description: >-
  Steam Headless als Gaming-Host auf UmbrelOS. Nutzt die AMD-GPU über
  /dev/dri/renderD128 und Steam Remote Play für die offizielle Steam-Link-App
  auf Android TV. Kein Moonlight erforderlich.
developer: Community
website: https://steamheadless.com/
repo: https://github.com/Matze1985/umbrelos
support: https://github.com/Matze1985/umbrelos/issues
port: 8483
gallery: []
releaseNotes: >-
  Öffentlicher Zugriff über Port 8483. Caddy nutzt Loopback für die interne
  HTTPS-Verbindung zu Steam Headless.
permissions:
  - GPU
