version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: umbrelos-phonebox_phonebox-frontend_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "true"
    restart: on-failure

  postgres:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: phonebox
      POSTGRES_PASSWORD: "${APP_PASSWORD}"
      POSTGRES_DB: phonebox
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phonebox -d phonebox"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: on-failure
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: on-failure
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      EXEC: "1"
      POST: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      EVENTS: "1"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      SWARM: "0"
      SYSTEM: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  init-perms:
    image: alpine:3.20
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /data/uploads && chown -R 10001:10001 /data/uploads"]
    volumes:
      - ${APP_DATA_DIR}/data/uploads:/data/uploads

  phonebox-backend:
    image: phonebox-backend:0.1.0
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PHONEBOX_REF: master
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
      init-perms:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: "4000"
      PUBLIC_URL: "http://umbrel.local"
      FRONTEND_ORIGIN: "http://umbrel.local"
      DATABASE_URL: "postgresql://phonebox:${APP_PASSWORD}@postgres:5432/phonebox"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: "${APP_SEED}"
      JWT_WS_TICKET_SECRET: "${APP_PASSWORD}"
      JWT_ACCESS_TTL_SECONDS: "900"
      JWT_WS_TICKET_TTL_SECONDS: "60"
      REFRESH_TTL_SECONDS: "2592000"
      COOKIE_SECURE: "false"
      COOKIE_DOMAIN: ""
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
      DOCKER_NETWORK: "phonebox-net"
      CONTAINER_LABEL_PREFIX: "umbrelos-phonebox"
      ANDROID_IMAGE_PREFIX: "budtmo/docker-android"
      KVM_GID: "${KVM_GID:-108}"
      NOVNC_PORT_MIN: "6900"
      NOVNC_PORT_MAX: "7900"
      ADB_PORT_MIN: "5500"
      ADB_PORT_MAX: "6500"
      UPLOADS_DIR: "/data/uploads"
      UPLOADS_HOST_DIR: "${APP_DATA_DIR}/data/uploads"
      APK_MAX_BYTES: "209715200"
      SKIN_MAX_BYTES: "20971520"
      DEFAULT_MAX_DEVICES: "1"
      DEFAULT_MAX_STORAGE_MB: "2048"
      DEFAULT_MAX_SESSION_MINUTES: "120"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "Android Cloud <noreply@umbrel.local>"
      ADMIN_EMAIL: "admin@umbrelos-phonebox.local"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "${APP_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR}/data/uploads:/data/uploads
    networks:
      - default
      - android-net
    command:
      - sh
      - -c
      - npx prisma db push --accept-data-loss && npm run prisma:seed && node dist/index.js
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  worker:
    image: phonebox-backend:0.1.0
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PHONEBOX_REF: master
    restart: on-failure
    depends_on:
      phonebox-backend:
        condition: service_started
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: "4000"
      PUBLIC_URL: "http://umbrel.local"
      FRONTEND_ORIGIN: "http://umbrel.local"
      DATABASE_URL: "postgresql://phonebox:${APP_PASSWORD}@postgres:5432/phonebox"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: "${APP_SEED}"
      JWT_WS_TICKET_SECRET: "${APP_PASSWORD}"
      JWT_ACCESS_TTL_SECONDS: "900"
      JWT_WS_TICKET_TTL_SECONDS: "60"
      REFRESH_TTL_SECONDS: "2592000"
      COOKIE_SECURE: "false"
      COOKIE_DOMAIN: ""
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
      DOCKER_NETWORK: "phonebox-net"
      CONTAINER_LABEL_PREFIX: "umbrelos-phonebox"
      ANDROID_IMAGE_PREFIX: "budtmo/docker-android"
      KVM_GID: "${KVM_GID:-108}"
      NOVNC_PORT_MIN: "6900"
      NOVNC_PORT_MAX: "7900"
      ADB_PORT_MIN: "5500"
      ADB_PORT_MAX: "6500"
      UPLOADS_DIR: "/data/uploads"
      UPLOADS_HOST_DIR: "${APP_DATA_DIR}/data/uploads"
      APK_MAX_BYTES: "209715200"
      SKIN_MAX_BYTES: "20971520"
      DEFAULT_MAX_DEVICES: "1"
      DEFAULT_MAX_STORAGE_MB: "2048"
      DEFAULT_MAX_SESSION_MINUTES: "120"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "Android Cloud <noreply@umbrel.local>"
      ADMIN_EMAIL: "admin@umbrelos-phonebox.local"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "${APP_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR}/data/uploads:/data/uploads
    networks:
      - default
      - android-net
    command: ["node", "dist/workers/index.js"]

  phonebox-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        PHONEBOX_REF: master
    restart: on-failure
    depends_on:
      phonebox-backend:
        condition: service_started
    networks:
      - default

networks:
  default:
  android-net:
    name: phonebox-net
    driver: bridge
