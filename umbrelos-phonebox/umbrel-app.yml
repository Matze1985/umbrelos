manifestVersion: 1
id: umbrelos-phonebox
category: developer
name: Phonebox
version: "0.0.1"
tagline: Private multi-user Android devices in your browser
description: >-
  Run isolated Android emulator instances for invited users on your Umbrel.
  Each user gets a private device with persistent storage, APK installation,
  and browser-based control through noVNC. Google Play is not included.
developer: Community
website: https://github.com/Matze1985/umbrelos
repo: https://github.com/Matze1985/umbrelos
support: https://github.com/pfurpass/phonebox/issues
port: 80
gallery: []
path: ""
defaultUsername: admin
defaultPassword: ""
dependencies: []
releaseNotes: >-
  Initial Umbrel integration scaffold based on Phonebox. Private accounts,
  per-user Android emulator containers, APK upload and browser streaming.
