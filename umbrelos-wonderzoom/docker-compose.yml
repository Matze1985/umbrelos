version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: wonderzoom_web_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "true"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: wonderzoom:0.1.0
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/scenes:/app/data/scenes
    environment:
      PORT: "8080"
      SCENES_DIR: /app/data/scenes
