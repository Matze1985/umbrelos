services:
  desktop:
    image: josh5/steam-headless:2
    container_name: steam-gaming-server
    hostname: steam-gaming-server
    restart: unless-stopped
    network_mode: host

    cap_add:
      - DAC_READ_SEARCH
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_NICE
      - SYS_PTRACE
      - SYS_RESOURCE

    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
      - systempaths=unconfined
      - writable-cgroups=true

    cgroup: private
    stop_signal: SIGRTMIN+3
    stop_grace_period: 30s
    pids_limit: 8192
    shm_size: 2gb
    tty: true

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Berlin

    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/fuse:/dev/fuse
      - /dev/uinput:/dev/uinput
      - /dev/uhid:/dev/uhid

    device_cgroup_rules:
      - "c 13:* rwm"

    tmpfs:
      - /run
      - /run/lock
      - /tmp
      - /dev/input:rw,dev,mode=0755

    volumes:
      - /etc/localtime:/run/host-localtime:ro
      - /sys/devices/virtual/input:/sys/devices/virtual/input:ro
      - steam-gaming-home:/home/steamheadless
      - steam-gaming-state:/var/lib/steam-headless
      - steam-gaming-journal:/var/log/journal
      - steam-gaming-games:/mnt/games

  http-proxy:
    image: caddy:2
    container_name: steam-gaming-server-http
    restart: unless-stopped
    network_mode: host

    depends_on:
      - desktop

    entrypoint:
      - caddy

    command:
      - reverse-proxy
      - --from
      - http://:18080
      - --to
      - https://127.0.0.1:8483
      - --change-host-header
      - --insecure

volumes:
  steam-gaming-home:
  steam-gaming-state:
  steam-gaming-journal:
  steam-gaming-games:
