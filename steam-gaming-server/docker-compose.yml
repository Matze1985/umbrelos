services:
  desktop:
    image: josh5/steam-headless:2
    container_name: steam-gaming-server
    hostname: steam-gaming-server
    restart: unless-stopped
    network_mode: host

    # Steam Headless benötigt systemd-, Audio- und Input-Fähigkeiten.
    cap_add:
      - DAC_READ_SEARCH
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_NICE
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
      - seccomp=unconfined
      - systempaths=unconfined
      - writable-cgroups=true
    cgroup: private

    stop_signal: SIGRTMIN+3
    stop_grace_period: 30s
    pids_limit: 8192
    shm_size: 2gb
    tty: true

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Berlin

    # AMD Phoenix1: host renderD128 wird unverändert durchgereicht.
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/fuse:/dev/fuse
      - /dev/uinput:/dev/uinput
      - /dev/uhid:/dev/uhid

    device_cgroup_rules:
      - "c 13:* rwm"

    tmpfs:
      - /run
      - /run/lock
      - /tmp
      - /dev/input:rw,dev,mode=0755

    volumes:
      - /etc/localtime:/run/host-localtime:ro
      - /sys/devices/virtual/input:/sys/devices/virtual/input:ro
      - steam-gaming-home:/home/steamheadless
      - steam-gaming-state:/var/lib/steam-headless
      - steam-gaming-journal:/var/log/journal
      - steam-gaming-games:/mnt/games

volumes:
  steam-gaming-home:
  steam-gaming-state:
  steam-gaming-journal:
  steam-gaming-games:
