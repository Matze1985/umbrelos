manifestVersion: 1
icon: https://raw.githubusercontent.com/Steam-Headless/docker-steam-headless/master/assets/icon.png
id: steam-gaming-server
category: gaming
name: Steam Gaming Server
version: "1.0.0"
tagline: Steam-Spiele mit AMD-Grafik auf Android TV streamen
description: >-
  Steam Headless als Gaming-Host auf UmbrelOS. Nutzt die AMD-GPU über
  /dev/dri/renderD128 und Steam Remote Play für die offizielle Steam-Link-App
  auf Android TV. Kein Moonlight erforderlich.
developer: Community
website: https://steamheadless.com/
repo: https://github.com/Steam-Headless/docker-steam-headless
support: https://github.com/Steam-Headless/docker-steam-headless/issues
port: 8483
gallery: []
releaseNotes: >-
  Erste Community-App-Version. Steam Headless mit AMD-Render-Node,
  Steam Remote Play und persistenten Docker-Volumes.
permissions:
  - GPU
